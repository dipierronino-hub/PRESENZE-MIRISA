<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mirisa - Presenze Vocali Assistite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #070d19;
      --surface: #0f1b33;
      --surface-border: #1a2c4e;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --radius: 14px;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
    .ai-badge { display: inline-block; background: linear-gradient(135deg, #0284c7, #10b981); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }

    .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

    .voice-box { text-align: center; padding: 20px 10px; }
    .mic-button {
      width: 90px; height: 90px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff; font-size: 34px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }
    .mic-button.recording {
      background: linear-gradient(135deg, #ef4444, #f43f5e);
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .voice-hint { margin-top: 14px; font-size: 13px; color: var(--text-muted); line-height: 1.4; }
    .speech-transcript {
      background: #081120; border: 1px solid var(--surface-border);
      border-radius: 10px; padding: 12px; margin-top: 16px;
      font-size: 13px; color: #fff; min-height: 48px; text-align: left; font-style: italic;
    }

    #preview-box { display: none; }
    .preview-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px;
    }
    .preview-item:last-child { border-bottom: none; }
    .badge-preview { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    .badge-intera { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-mezza { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-assente { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge-ferie { background: rgba(139, 92, 246, 0.2); color: var(--purple); }

    .btn-confirm {
      width: 100%; margin-top: 16px; padding: 14px; border-radius: 10px;
      border: none; background: #10b981; color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
    }
    .btn-confirm:active { transform: scale(0.98); }
    .btn-confirm.loading {
      background: #0284c7 !important;
      cursor: wait;
    }
    .btn-confirm.success {
      background: #059669 !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    #toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 10px; border-left: 4px solid var(--success); display: none; text-align: center; font-size: 14px; font-weight: 600; z-index: 200; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">
      <div class="ai-badge"><i class="fa-solid fa-bolt"></i> Motore Vocale Intelligente</div>
      <h1>MIRISA <span>CERAMICHE</span></h1>
      <p>Registrazione Presenze Vocale Diretta</p>
    </div>

    <div class="card">
      <div style="margin-bottom: 14px;">
        <label style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 6px;">Data registrazione attiva</label>
        <input type="date" id="selected-date" style="width: 100%; background: #081120; border: 1px solid var(--surface-border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none;">
      </div>

      <div class="voice-box">
        <button id="btn-mic" class="mic-button" onclick="toggleVoiceRecording()">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <div id="mic-status" class="voice-hint">Tocca il microfono e parla liberamente</div>
        <div id="transcript" class="speech-transcript">In attesa della tua voce...</div>
      </div>
    </div>

    <div class="card" id="preview-box">
      <h3 style="margin: 0 0 12px; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-list-check"></i> Riepilogo Presenze Rilevate:
      </h3>
      <div id="preview-list"></div>
      
      <button id="btn-salva" class="btn-confirm" onclick="confermaSalvataggio()">
        <i class="fa-solid fa-cloud-arrow-up"></i> <span>Salva su Database</span>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAb6M5iEzafntiQbr7fj76XrZYNjmz17tE",
      authDomain: "presenze-dipendenti-e377b.firebaseapp.com",
      databaseURL: "https://presenze-dipendenti-e377b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "presenze-dipendenti-e377b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Imposta data corrente
    const dOggi = new Date();
    const annoOggi = dOggi.getFullYear();
    const meseOggi = String(dOggi.getMonth() + 1).padStart(2, '0');
    const giornoOggi = String(dOggi.getDate()).padStart(2, '0');
    document.getElementById("selected-date").value = `${annoOggi}-${meseOggi}-${giornoOggi}`;

    // Struttura mappa anagrafica: { "Nome Completo": { id: "firebaseKey", nome: "Nome Completo" } }
    let dipendentiMap = {
      "Errede Francesca": { id: "Errede_Francesca", nome: "Errede Francesca" },
      "Antonio Campobasso": { id: "Antonio_Campobasso", nome: "Antonio Campobasso" },
      "Dipierro Sebastiano": { id: "Dipierro_Sebastiano", nome: "Dipierro Sebastiano" },
      "Sansone Andrea": { id: "Sansone_Andrea", nome: "Sansone Andrea" },
      "Bulicko Davide": { id: "Bulicko_Davide", nome: "Bulicko Davide" },
      "Ungaro Maria Domenica": { id: "Ungaro_Maria_Domenica", nome: "Ungaro Maria Domenica" },
      "Loschiavone Isabella": { id: "Loschiavone_Isabella", nome: "Loschiavone Isabella" },
      "Gongo Pellump": { id: "Gongo_Pellump", nome: "Gongo Pellump" },
      "Latifi Rudina": { id: "Latifi_Rudina", nome: "Latifi Rudina" },
      "Scarano Margherita": { id: "Scarano_Margherita", nome: "Scarano Margherita" },
      "Ressa Vito": { id: "Ressa_Vito", nome: "Ressa Vito" }
    };

    let presenzeProposte = [];

    // Sincronizza dinamicamente le chiavi ID originali da Firebase se presenti
    onValue(ref(db, "dipendenti"), (snap) => {
      const data = snap.val();
      if (data) {
        Object.keys(data).forEach(k => {
          const val = data[k];
          const nomeDip = typeof val === 'string' ? val : (val.nome || val.nominativo);
          if (nomeDip) {
            dipendentiMap[nomeDip] = { id: k, nome: nomeDip };
          }
        });
      }
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 3000);
    }

    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById("btn-mic").classList.add("recording");
        document.getElementById("mic-status").textContent = "Ti sto ascoltando... Parla ora!";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById("transcript").textContent = `"${text}"`;
        elaboraFrase(text);
      };

      recognition.onerror = () => {
        isRecording = false;
        document.getElementById("btn-mic").classList.remove("recording");
        document.getElementById("mic-status").textContent = "Errore microfono. Riprova.";
      };

      recognition.onend = () => {
        isRecording = false;
        document.getElementById("btn-mic").classList.remove("recording");
      };
    }

    window.toggleVoiceRecording = function() {
      if (!recognition) return alert("Riconoscimento vocale non supportato su questo browser.");
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    };

    function estraiDataDaTesto(testo) {
      const t = testo.toLowerCase();
      const refDate = new Date();

      if (t.includes("l'altro ieri") || t.includes("l altro ieri") || t.includes("altroieri")) {
        refDate.setDate(refDate.getDate() - 2);
        return formattaDataISO(refDate);
      }
      if (t.includes("ieri")) {
        refDate.setDate(refDate.getDate() - 1);
        return formattaDataISO(refDate);
      }
      if (t.includes("oggi")) {
        return formattaDataISO(refDate);
      }

      const mesi = {
        "gennaio": 1, "febbraio": 2, "marzo": 3, "aprile": 4,
        "maggio": 5, "giugno": 6, "luglio": 7, "agosto": 8,
        "settembre": 9, "ottobre": 10, "novembre": 11, "dicembre": 12
      };

      const regexData = /(\b\d{1,2}\b)\s*(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s*(\d{4})?/i;
      const match = t.match(regexData);

      if (match) {
        const giorno = parseInt(match[1], 10);
        const mese = mesi[match[2].toLowerCase()];
        const anno = match[3] ? parseInt(match[3], 10) : refDate.getFullYear();
        const dataCalcolata = new Date(anno, mese - 1, giorno);
        if (!isNaN(dataCalcolata.getTime())) {
          return formattaDataISO(dataCalcolata);
        }
      }
      return null;
    }

    function formattaDataISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Sigle usate dal Planning di Mirisa: I, M, P, A, F, MAL
    function rilevaSiglaStato(testo) {
      const t = testo.toLowerCase();
      if (t.includes("assent") || t.includes("manc") || t.includes("non c'è") || t.includes("non ce")) return { sigla: "A", label: "Assente" };
      if (t.includes("feri")) return { sigla: "F", label: "Ferie" };
      if (t.includes("malatt") || t.includes("indispost")) return { sigla: "MAL", label: "Malattia" };
      if (t.includes("pomerigg")) return { sigla: "P", label: "Pomeriggio" };
      if (t.includes("mezz") || t.includes("mattin")) return { sigla: "M", label: "Mattina" };
      return { sigla: "I", label: "Intera" };
    }

    function elaboraFrase(frase) {
      document.getElementById("mic-status").textContent = "Elaborazione in corso...";
      
      const dataRilevata = estraiDataDaTesto(frase);
      if (dataRilevata) {
        document.getElementById("selected-date").value = dataRilevata;
      }

      const text = frase.toLowerCase();
      const listaNomi = Object.keys(dipendentiMap);
      let risultati = [];

      if (text.includes("tutt") || text.includes("squadra")) {
        const statoObj = rilevaSiglaStato(text.split(/tranne|eccetto|meno/)[0]);
        risultati = listaNomi.map(n => ({
          nome: n,
          id: dipendentiMap[n].id,
          statoSigla: statoObj.sigla,
          statoLabel: statoObj.label
        }));

        if (text.includes("tranne") || text.includes("eccetto") || text.includes("meno")) {
          const parteEccezioni = text.split(/tranne|eccetto|meno/)[1];
          const eccObj = rilevaSiglaStato(parteEccezioni);
          const siglaApplicare = eccObj.sigla === statoObj.sigla ? (statoObj.sigla === "I" ? "A" : "I") : eccObj.sigla;
          const labelApplicare = siglaApplicare === "A" ? "Assente" : (siglaApplicare === "I" ? "Intera" : eccObj.label);

          listaNomi.forEach(nome => {
            const parole = nome.toLowerCase().split(" ");
            if (parole.some(p => p.length > 2 && parteEccezioni.includes(p))) {
              const idx = risultati.findIndex(r => r.nome === nome);
              if (idx !== -1) {
                risultati[idx].statoSigla = siglaApplicare;
                risultati[idx].statoLabel = labelApplicare;
              }
            }
          });
        }
      } else {
        const statoObj = rilevaSiglaStato(text);
        let trovati = 0;

        listaNomi.forEach(nome => {
          const parole = nome.toLowerCase().split(" ");
          const nomeCompresso = nome.toLowerCase().replace(/\s+/g, '');
          const fraseCompressa = text.replace(/\s+/g, '');

          if (parole.some(p => p.length > 2 && text.includes(p)) || fraseCompressa.includes(nomeCompresso)) {
            risultati.push({
              nome: nome,
              id: dipendentiMap[nome].id,
              statoSigla: statoObj.sigla,
              statoLabel: statoObj.label
            });
            trovati++;
          }
        });

        if (trovati === 0) {
          let pulito = frase.replace(/ieri|oggi|l'altro ieri|presente|presenti|assente|assenti|ferie|malattia|mezza|mattina|pomeriggio|intera|gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre|\d{1,2}|\d{4}/gi, "").trim();
          pulito = pulito.replace(/^[,\s]+|[,\s]+$/g, "");
          if (pulito.length > 1) {
            risultati.push({
              nome: pulito,
              id: pulito.replace(/[^a-zA-Z0-9]/g, "_"),
              statoSigla: statoObj.sigla,
              statoLabel: statoObj.label
            });
          }
        }
      }

      if (risultati.length > 0) {
        presenzeProposte = risultati;
        mostraAnteprima(presenzeProposte);
        const dataAttiva = document.getElementById("selected-date").value;
        document.getElementById("mic-status").textContent = `Presenze pronte per la data: ${dataAttiva}`;
      } else {
        document.getElementById("mic-status").textContent = "Nessun collaboratore riconosciuto. Riprova.";
      }
    }

    function mostraAnteprima(elenco) {
      const box = document.getElementById("preview-box");
      const list = document.getElementById("preview-list");
      list.innerHTML = "";

      elenco.forEach(item => {
        let badgeClass = "badge-intera";
        if (item.statoSigla === "M" || item.statoSigla === "P") badgeClass = "badge-mezza";
        if (item.statoSigla === "A" || item.statoSigla === "MAL") badgeClass = "badge-assente";
        if (item.statoSigla === "F") badgeClass = "badge-ferie";

        const div = document.createElement("div");
        div.className = "preview-item";
        div.innerHTML = `
          <span><strong>${item.nome}</strong></span>
          <span class="badge-preview ${badgeClass}">${item.statoLabel} (${item.statoSigla})</span>
        `;
        list.appendChild(div);
      });

      // Reset stato del pulsante
      const btn = document.getElementById("btn-salva");
      btn.className = "btn-confirm";
      btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Salva su Database</span>`;
      btn.disabled = false;

      box.style.display = "block";
    }

    // SALVATAGGIO CON MULTI-SCRITTURA DIRETTA AL PLANNING E CAMBIO COLORE TASTO
    window.confermaSalvataggio = async function() {
      const dataSel = document.getElementById("selected-date").value;
      if (!dataSel || presenzeProposte.length === 0) return;

      const btn = document.getElementById("btn-salva");
      // 1. CAMBIO COLORE: Diventa blu e mostra rotella
      btn.classList.add("loading");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Salvataggio in corso...</span>`;
      btn.disabled = true;

      const [anno, mese, giornoStr] = dataSel.split("-");
      const meseAnno = `${anno}-${mese}`;       // es: "2026-09"
      const giornoNum = parseInt(giornoStr, 10);  // es: 25
      const giorno2Digit = giornoStr.padStart(2, '0'); // es: "25"

      const updates = {};

      presenzeProposte.forEach(item => {
        const idDip = item.id;
        const nomeClean = item.nome.replace(/[^a-zA-Z0-9]/g, "_");
        const sigla = item.statoSigla;

        // Struttura A: Griglia per mese presenze/2026-09/25/id = "I"
        updates[`presenze/${meseAnno}/${giornoNum}/${idDip}`] = sigla;
        updates[`presenze/${meseAnno}/${giornoNum}/${nomeClean}`] = sigla;
        updates[`presenze/${meseAnno}/${giornoNum}/${item.nome}`] = sigla;
        updates[`presenze/${meseAnno}/${giorno2Digit}/${idDip}`] = sigla;
        updates[`presenze/${meseAnno}/${giorno2Digit}/${nomeClean}`] = sigla;

        // Struttura B: presenze/2026-09/id/25 = "I"
        updates[`presenze/${meseAnno}/${idDip}/${giornoNum}`] = sigla;
        updates[`presenze/${meseAnno}/${nomeClean}/${giornoNum}`] = sigla;
        updates[`presenze/${meseAnno}/${item.nome}/${giornoNum}`] = sigla;
        updates[`presenze/${meseAnno}/${idDip}/${giorno2Digit}`] = sigla;

        // Struttura C: Giornaliera estesa presenze/2026-09-25/id
        updates[`presenze/${dataSel}/${idDip}`] = {
          dipendente: item.nome,
          data: dataSel,
          stato: sigla,
          statoEsteso: item.statoLabel,
          orario: new Date().toISOString()
        };
        updates[`presenze/${dataSel}/${nomeClean}`] = {
          dipendente: item.nome,
          data: dataSel,
          stato: sigla,
          statoEsteso: item.statoLabel,
          orario: new Date().toISOString()
        };

        // Struttura D: presenze_registro
        updates[`presenze_registro/${idDip}/${dataSel}`] = sigla;
      });

      try {
        await update(ref(db), updates);

        // 2. CAMBIO COLORE: Diventa VERDE BRILLANTE con spunta
        btn.classList.remove("loading");
        btn.classList.add("success");
        btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Presenze Registrate!</span>`;

        showToast(`Presenze salvate per il ${dataSel}!`);

        // Scomparsa fluida dopo 1.5 secondi
        setTimeout(() => {
          document.getElementById("preview-box").style.display = "none";
          document.getElementById("transcript").textContent = "In attesa della tua voce...";
          presenzeProposte = [];
        }, 1500);

      } catch (err) {
        btn.classList.remove("loading");
        btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>Errore di Salvataggio</span>`;
        alert("Errore salvataggio: " + err.message);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
