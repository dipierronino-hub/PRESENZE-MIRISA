<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mirisa - Presenze Vocali Assistite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #070d19;
      --surface: #0f1b33;
      --surface-border: #1a2c4e;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --radius: 14px;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
    .ai-badge { display: inline-block; background: linear-gradient(135deg, #0284c7, #10b981); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }

    .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

    .voice-box { text-align: center; padding: 20px 10px; }
    .mic-button {
      width: 90px; height: 90px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff; font-size: 34px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }
    .mic-button.recording {
      background: linear-gradient(135deg, #ef4444, #f43f5e);
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .voice-hint { margin-top: 14px; font-size: 13px; color: var(--text-muted); line-height: 1.4; }
    .speech-transcript {
      background: #081120; border: 1px solid var(--surface-border);
      border-radius: 10px; padding: 12px; margin-top: 16px;
      font-size: 13px; color: #fff; min-height: 48px; text-align: left; font-style: italic;
    }

    #preview-box { display: none; }
    .preview-item {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px;
      background: #081120; border-radius: 8px; margin-bottom: 8px;
    }
    .preview-header { display: flex; justify-content: space-between; align-items: center; }
    .status-selector { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-opt {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--surface-border);
      font-size: 11px; font-weight: 700; background: #0f1b33; color: var(--text-muted); cursor: pointer;
    }
    .btn-opt.active-intera { background: rgba(16, 185, 129, 0.25); color: var(--success); border-color: var(--success); }
    .btn-opt.active-assente { background: rgba(239, 68, 68, 0.25); color: var(--danger); border-color: var(--danger); }
    .btn-opt.active-mezza { background: rgba(245, 158, 11, 0.25); color: var(--warning); border-color: var(--warning); }
    .btn-opt.active-ferie { background: rgba(139, 92, 246, 0.25); color: var(--purple); border-color: var(--purple); }

    .btn-confirm {
      width: 100%; margin-top: 16px; padding: 14px; border-radius: 10px;
      border: none; background: #10b981; color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
    }
    .btn-confirm:active { transform: scale(0.98); }
    .btn-confirm.loading { background: #0284c7 !important; cursor: wait; }
    .btn-confirm.success { background: #059669 !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }

    #toast { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 10px; border-left: 4px solid var(--success); display: none; text-align: center; font-size: 14px; font-weight: 600; z-index: 200; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">
      <div class="ai-badge"><i class="fa-solid fa-bolt"></i> Sistema Vocale Mirisa</div>
      <h1>MIRISA <span>CERAMICHE</span></h1>
      <p>Sincronizzazione Diretta Planning</p>
    </div>

    <div class="card">
      <div style="margin-bottom: 14px;">
        <label style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 6px;">Data registrazione di riferimento</label>
        <input type="date" id="selected-date" style="width: 100%; background: #081120; border: 1px solid var(--surface-border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none;">
      </div>

      <div class="voice-box">
        <button id="btn-mic" class="mic-button" onclick="toggleVoiceRecording()">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <div id="mic-status" class="voice-hint">Tocca il microfono e parla</div>
        <div id="transcript" class="speech-transcript">In attesa della tua voce...</div>
      </div>
    </div>

    <div class="card" id="preview-box">
      <h3 style="margin: 0 0 12px; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-list-check"></i> Registrazioni Rilevate:
      </h3>
      <div id="preview-list"></div>
      
      <button id="btn-salva" class="btn-confirm" onclick="confermaSalvataggio()">
        <i class="fa-solid fa-cloud-arrow-up"></i> <span>Salva su Database</span>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAb6M5iEzafntiQbr7fj76XrZYNjmz17tE",
      authDomain: "presenze-dipendenti-e377b.firebaseapp.com",
      databaseURL: "https://presenze-dipendenti-e377b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "presenze-dipendenti-e377b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function pad(n) { return String(n).padStart(2, '0'); }

    // Impostazione data odierna
    const dOggi = new Date();
    document.getElementById("selected-date").value = `${dOggi.getFullYear()}-${pad(dOggi.getMonth() + 1)}-${pad(dOggi.getDate())}`;

    let catalogoDipendenti = [];
    window.operazioniProposte = [];

    onValue(ref(db, "dipendenti"), (snap) => {
      const data = snap.val() || {};
      catalogoDipendenti = [];

      Object.keys(data).forEach(id => {
        const d = data[id];
        const nome = (typeof d === "string") ? d : (d.nome || id);
        catalogoDipendenti.push({
          id: id,
          nome: nome.trim(),
          tokens: nome.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w.length >= 3)
        });
      });

      document.getElementById("mic-status").textContent = `Pronto! ${catalogoDipendenti.length} dipendenti sincronizzati.`;
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 3000);
    }

    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById("btn-mic").classList.add("recording");
        document.getElementById("mic-status").textContent = "Ti sto ascoltando... Parla ora!";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById("transcript").textContent = `"${text}"`;
        elaboraFrase(text);
      };

      recognition.onerror = () => {
        isRecording = false;
        document.getElementById("btn-mic").classList.remove("recording");
        document.getElementById("mic-status").textContent = "Errore microfono. Riprova.";
      };

      recognition.onend = () => {
        isRecording = false;
        document.getElementById("btn-mic").classList.remove("recording");
      };
    }

    window.toggleVoiceRecording = function() {
      if (!recognition) return alert("Riconoscimento vocale non supportato.");
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    };

    function estraiTuttiIGiorni(testo) {
      const t = testo.toLowerCase();
      const refDate = new Date();
      let anno = refDate.getFullYear();
      let mese = refDate.getMonth() + 1;

      const mesiMap = {
        "gennaio": 1, "febbraio": 2, "marzo": 3, "aprile": 4,
        "maggio": 5, "giugno": 6, "luglio": 7, "agosto": 8,
        "settembre": 9, "ottobre": 10, "novembre": 11, "dicembre": 12
      };

      Object.keys(mesiMap).forEach(mStr => {
        if (t.includes(mStr)) mese = mesiMap[mStr];
      });

      let tSenzaAnno = t.replace(/\b202[0-9]\b/g, "");

      const numeriParole = {
        "primo": 1, "uno": 1, "due": 2, "tre": 3, "quattro": 4, "cinque": 5,
        "sei": 6, "sette": 7, "otto": 8, "nove": 9, "dieci": 10,
        "undici": 11, "dodici": 12, "tredici": 13, "quattordici": 14, "quindici": 15,
        "sedici": 16, "diciassette": 17, "diciotto": 18, "diciannove": 19, "venti": 20,
        "ventuno": 21, "ventidue": 22, "ventitre": 23, "ventitré": 23, "ventiquattro": 24,
        "venticinque": 25, "ventisei": 26, "ventisette": 27, "ventotto": 28, "ventinove": 29,
        "trenta": 30, "trentuno": 31
      };

      let giorni = [];

      const matchRange = tSenzaAnno.match(/(?:dal|da)\s+(\d{1,2})\s+(?:al|fino\s+al)\s+(\d{1,2})/);
      if (matchRange) {
        const start = parseInt(matchRange[1], 10);
        const end = parseInt(matchRange[2], 10);
        for (let g = start; g <= end; g++) giorni.push(g);
      } else {
        const regexGiorno = /(?:il|del|giorno|\b)\s*(\b[1-9]\b|\b[12][0-9]\b|\b3[01]\b)(?!\s*euro)/g;
        let match;
        while ((match = regexGiorno.exec(tSenzaAnno)) !== null) {
          const val = parseInt(match[1], 10);
          if (val >= 1 && val <= 31 && !giorni.includes(val)) {
            giorni.push(val);
          }
        }

        if (giorni.length === 0) {
          Object.keys(numeriParole).forEach(parola => {
            const regexP = new RegExp(`\\b${parola}\\b`);
            if (regexP.test(tSenzaAnno)) {
              const val = numeriParole[parola];
              if (!giorni.includes(val)) giorni.push(val);
            }
          });
        }
      }

      if (giorni.length === 0) {
        if (t.includes("l'altro ieri") || t.includes("l altro ieri") || t.includes("altroieri")) {
          const d = new Date(refDate);
          d.setDate(d.getDate() - 2);
          giorni.push(d.getDate());
          mese = d.getMonth() + 1;
          anno = d.getFullYear();
        } else if (t.includes("ieri")) {
          const d = new Date(refDate);
          d.setDate(d.getDate() - 1);
          giorni.push(d.getDate());
          mese = d.getMonth() + 1;
          anno = d.getFullYear();
        } else if (t.includes("oggi")) {
          giorni.push(refDate.getDate());
          mese = refDate.getMonth() + 1;
          anno = refDate.getFullYear();
        }
      }

      return { anno, mese, giorni };
    }

    function estraiStatoRigoroso(testo) {
      const t = testo.toLowerCase();
      if (t.includes("assent") || t.includes("manc") || t.includes("non c'è") || t.includes("non ce") || t.includes("assenza")) {
        return "Assente";
      }
      if (t.includes("feri") || t.includes("chiusur")) return "Ferie";
      if (t.includes("malatt") || t.includes("indispost")) return "Malattia";
      if (t.includes("pomerigg")) return "Pomeriggio";
      if (t.includes("mezz") || t.includes("mattin")) return "Mattina";
      return "Intera";
    }

    function elaboraFrase(frase) {
      document.getElementById("mic-status").textContent = "Elaborazione...";

      const infoData = estraiTuttiIGiorni(frase);
      const statoGlobale = estraiStatoRigoroso(frase);
      const t = frase.toLowerCase();

      let dipendentiCoinvolti = [];

      if (t.includes("tutt") || t.includes("squadra")) {
        dipendentiCoinvolti = catalogoDipendenti.map(d => d.nome);
      } else {
        let punteggi = [];
        catalogoDipendenti.forEach(dip => {
          let score = 0;
          dip.tokens.forEach(tok => {
            if (t.includes(tok)) score += 5;
          });

          if (t.includes("sansone") && dip.nome.toLowerCase().includes("sansone")) score += 30;
          if (t.includes("andrea") && dip.nome.toLowerCase().includes("andrea")) score += 20;
          if (t.includes("ressa") && dip.nome.toLowerCase().includes("ressa")) score += 30;
          if (t.includes("vito") && dip.nome.toLowerCase().includes("vito")) score += 20;
          if (t.includes("bulicko") && dip.nome.toLowerCase().includes("bulicko")) score += 30;
          if (t.includes("davide") && dip.nome.toLowerCase().includes("davide")) score += 20;
          if (t.includes("scarano") && dip.nome.toLowerCase().includes("scarano")) score += 30;
          if (t.includes("margherita") && dip.nome.toLowerCase().includes("margherita")) score += 20;
          if (t.includes("loschiavone") && dip.nome.toLowerCase().includes("loschiavone")) score += 30;
          if (t.includes("isabella") && dip.nome.toLowerCase().includes("isabella")) score += 20;
          if (t.includes("pellump") && dip.nome.toLowerCase().includes("pellump")) score += 30;
          if (t.includes("campobasso") && dip.nome.toLowerCase().includes("campobasso")) score += 30;
          if ((t.includes("dipierro") || t.includes("di piero")) && dip.nome.toLowerCase().includes("dipierro")) score += 30;

          if (score > 0) punteggi.push({ nome: dip.nome, score });
        });

        if (punteggi.length > 0) {
          punteggi.sort((a, b) => b.score - a.score);
          dipendentiCoinvolti.push(punteggi[0].nome);
        }
      }

      let giorniFinali = infoData.giorni;
      let annoFinale = infoData.anno;
      let meseFinale = infoData.mese;

      if (giorniFinali.length === 0) {
        const selVal = document.getElementById("selected-date").value;
        const [a, m, g] = selVal.split("-");
        annoFinale = parseInt(a, 10);
        meseFinale = parseInt(m, 10);
        giorniFinali = [parseInt(g, 10)];
      }

      window.operazioniProposte = [];
      dipendentiCoinvolti.forEach(nomeDip => {
        giorniFinali.forEach(giorno => {
          // CALCOLO CHIAVE CON COMPENSAZIONE CALCOLATA SUL CALENDARIO:
          // Se diciamo giorno 14, admin.html legge da (14 + 1) = 15
          const targetDateObj = new Date(annoFinale, meseFinale - 1, giorno + 1, 12, 0, 0);
          const aKey = targetDateObj.getFullYear();
          const mKey = pad(targetDateObj.getMonth() + 1);
          const gKey = pad(targetDateObj.getDate());
          const chiaveFirebase = `${aKey}-${mKey}-${gKey}`;

          window.operazioniProposte.push({
            nome: nomeDip,
            chiaveFirebase: chiaveFirebase,
            giornoDichiarato: giorno,
            meseDichiarato: meseFinale,
            annoDichiarato: annoFinale,
            stato: statoGlobale
          });
        });
      });

      if (window.operazioniProposte.length > 0) {
        renderizzaAnteprima();
        document.getElementById("mic-status").textContent = `Riconosciuto! Controlla e salva.`;
      } else {
        document.getElementById("mic-status").textContent = "Nessun collaboratore riconosciuto. Riprova chiaramente.";
      }
    }

    window.cambiaStatoManuale = function(index, nuovoStato) {
      window.operazioniProposte[index].stato = nuovoStato;
      renderizzaAnteprima();
    };

    function renderizzaAnteprima() {
      const box = document.getElementById("preview-box");
      const list = document.getElementById("preview-list");
      list.innerHTML = "";

      window.operazioniProposte.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "preview-item";
        div.innerHTML = `
          <div class="preview-header">
            <strong>${item.nome} &bull; Giorno ${item.giornoDichiarato}/${item.meseDichiarato}/${item.annoDichiarato}</strong>
            <span style="font-size:12px; font-weight:800; color:${item.stato === 'Assente' ? 'var(--danger)' : 'var(--success)'};">${item.stato}</span>
          </div>
          <div class="status-selector">
            <button class="btn-opt ${item.stato === 'Intera' ? 'active-intera' : ''}" onclick="cambiaStatoManuale(${idx}, 'Intera')">Intera</button>
            <button class="btn-opt ${item.stato === 'Assente' ? 'active-assente' : ''}" onclick="cambiaStatoManuale(${idx}, 'Assente')">Assente</button>
            <button class="btn-opt ${item.stato === 'Mattina' ? 'active-mezza' : ''}" onclick="cambiaStatoManuale(${idx}, 'Mattina')">Mattina</button>
            <button class="btn-opt ${item.stato === 'Pomeriggio' ? 'active-mezza' : ''}" onclick="cambiaStatoManuale(${idx}, 'Pomeriggio')">Pomeriggio</button>
            <button class="btn-opt ${item.stato === 'Ferie' ? 'active-ferie' : ''}" onclick="cambiaStatoManuale(${idx}, 'Ferie')">Ferie</button>
          </div>
        `;
        list.appendChild(div);
      });

      const btn = document.getElementById("btn-salva");
      btn.className = "btn-confirm";
      btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Salva su Database</span>`;
      btn.disabled = false;

      box.style.display = "block";
    }

    window.confermaSalvataggio = async function() {
      if (!window.operazioniProposte || window.operazioniProposte.length === 0) return;

      const btn = document.getElementById("btn-salva");
      btn.classList.add("loading");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Salvataggio...</span>`;
      btn.disabled = true;

      const promises = window.operazioniProposte.map(item => {
        const safeKey = item.nome.replace(/[^a-zA-Z0-9]/g, "_");
        return set(ref(db, `presenze/${item.chiaveFirebase}/${safeKey}`), {
          dipendente: item.nome,
          data: item.chiaveFirebase,
          stato: item.stato,
          orarioRegistrazione: new Date().toISOString(),
          modificatoDa: "Voice App"
        });
      });

      try {
        await Promise.all(promises);

        btn.classList.remove("loading");
        btn.classList.add("success");
        btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Presenze Registrate!</span>`;

        showToast(`Salvate con successo!`);

        setTimeout(() => {
          document.getElementById("preview-box").style.display = "none";
          document.getElementById("transcript").textContent = "In attesa della tua voce...";
          window.operazioniProposte = [];
        }, 1500);

      } catch (err) {
        btn.classList.remove("loading");
        btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>Errore di Salvataggio</span>`;
        alert("Errore salvataggio: " + err.message);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
