<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mirisa - Terminale Operativo Presenze & Planning</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #070d19;
      --surface: #0f1b33;
      --surface-border: #1a2c4e;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --radius: 12px;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; min-height: 100vh; }
    
    /* SCHERMATA BLOCCO BIOMETRICA PER GIACOMO */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: #070d19;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .lock-box {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 30px 22px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .lock-icon {
      width: 54px;
      height: 54px;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .pin-instruction {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      margin: 6px 0 12px;
      min-height: 18px;
    }
    .pin-display {
      letter-spacing: 12px;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      width: 100%;
      background: #081120;
      border: 1px solid var(--surface-border);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 14px;
      outline: none;
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .pin-btn {
      background: #081120;
      border: 1px solid var(--surface-border);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 13px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pin-btn:active {
      background: #0284c7;
      transform: scale(0.96);
    }
    .pin-btn-bio {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent);
    }
    .pin-error {
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      min-height: 18px;
      display: none;
    }

    .container { max-width: 1400px; margin: 0 auto; display: none; }

    .brand { text-align: center; margin-bottom: 20px; position: relative; }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }
    .btn-top-lock { position: absolute; right: 0; top: 0; display: flex; gap: 6px; }
    .btn-lock-action { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); border-radius: 8px; padding: 6px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 12px; border-radius: var(--radius); border: 1px solid var(--surface-border); background: var(--surface); color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: transparent; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    input[type="date"], select { width: 100%; background: #081120; border: 1px solid var(--surface-border); color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 15px; outline: none; }

    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-status { background: #081120; border: 1px solid var(--surface-border); color: var(--text-muted); padding: 12px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-status.active { border-color: transparent; color: #fff; }
    .btn-status[data-status="Intera"].active { background: var(--success); }
    .btn-status[data-status="Mattina"].active, .btn-status[data-status="Pomeriggio"].active { background: var(--warning); color: #000; }
    .btn-status[data-status="Assente"].active { background: var(--danger); }
    .btn-status[data-status="Ferie"].active { background: var(--purple); }
    .btn-status[data-status="Malattia"].active { background: #64748b; }

    .btn-submit { width: 100%; margin-top: 18px; padding: 14px; border-radius: 10px; border: none; background: #0284c7; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .team-checklist { max-height: 220px; overflow-y: auto; background: #081120; border: 1px solid var(--surface-border); border-radius: 10px; padding: 10px; }
    .check-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; cursor: pointer; }
    .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #0284c7; }

    /* Planning Table Responsive */
    .planning-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.plan-table { width: 100%; border-collapse: collapse; text-align: center; }
    table.plan-table th, table.plan-table td { padding: 6px 2px; border: 1px solid var(--surface-border); }
    table.plan-table th { background: #081120; color: var(--text-muted); font-size: 10px; text-transform: uppercase; line-height: 1.2; }
    table.plan-table td.name-col { text-align: left; font-weight: 700; background: #0b1528; position: sticky; left: 0; z-index: 2; padding-left: 10px; min-width: 120px; font-size: 12px; }
    
    .plan-cell-interactive { cursor: pointer; user-select: none; }
    .plan-cell-interactive:active { background: rgba(56, 189, 248, 0.2) !important; }

    .cell-badge { display: inline-block; width: 24px; height: 24px; line-height: 24px; border-radius: 6px; font-size: 10px; font-weight: 800; margin: auto; }
    .cell-I { background: rgba(16, 185, 129, 0.25); color: var(--success); }
    .cell-M, .cell-P { background: rgba(245, 158, 11, 0.25); color: var(--warning); }
    .cell-A { background: rgba(239, 68, 68, 0.25); color: var(--danger); }
    .cell-F { background: rgba(139, 92, 246, 0.25); color: var(--purple); }
    .cell-MAL { background: rgba(100, 116, 139, 0.25); color: #94a3b8; }
    .cell-empty { color: #334155; font-size: 14px; }

    @media (min-width: 1024px) {
      table.plan-table { table-layout: fixed; width: 100%; min-width: 950px; }
      table.plan-table td.name-col { width: 150px; min-width: 150px; font-size: 13px; }
      table.plan-table th { font-size: 11px; padding: 8px 3px; }
      .cell-badge { width: 26px; height: 26px; line-height: 26px; font-size: 11px; }
    }

    @media (max-width: 1023px) {
      table.plan-table { min-width: 680px; }
    }

    /* Modal Popup Modifica Rapida */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); padding: 16px; }
    .modal { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); width: 100%; max-width: 380px; padding: 20px; box-shadow: 0 20px 25px rgba(0,0,0,0.6); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .quick-status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn-quick-status { padding: 12px 8px; border-radius: 8px; border: 1px solid var(--surface-border); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; background: #081120; }
    .btn-quick-status:active { transform: scale(0.96); }

    #toast { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 400px; margin: auto; background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 10px; border-left: 4px solid var(--success); display: none; text-align: center; font-size: 14px; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 200; }
  </style>

  <script>
    let pinInserito = "";
    let setupFase = 1;
    let pinTemporaneo = "";

    function initLockScreen() {
      const pinSalvato = localStorage.getItem("giacomo_pin_saved");
      const titleEl = document.getElementById("lockTitle");
      const instrEl = document.getElementById("pinInstruction");

      if (!pinSalvato) {
        titleEl.textContent = "Imposta Nuovo PIN";
        instrEl.textContent = "Scegli un PIN di 4 cifre per accedere";
      } else {
        titleEl.textContent = "Accesso Cantiere";
        instrEl.textContent = "Inserisci PIN o tocca l'impronta";
        if (localStorage.getItem("giacomo_bio_active") === "true") {
          setTimeout(avviaBiometriaGiacomo, 400);
        }
      }
    }

    function digitaPin(cifra) {
      if (pinInserito.length < 4) {
        pinInserito += cifra;
        aggiornaPinDisplay();
      }
      if (pinInserito.length === 4) {
        setTimeout(processaPin, 100);
      }
    }

    function cancellaPin() {
      pinInserito = pinInserito.slice(0, -1);
      aggiornaPinDisplay();
      document.getElementById("pinError").style.display = "none";
    }

    function aggiornaPinDisplay() {
      document.getElementById("pinInput").value = "*".repeat(pinInserito.length);
    }

    function processaPin() {
      const pinSalvato = localStorage.getItem("giacomo_pin_saved");
      const errEl = document.getElementById("pinError");
      const instrEl = document.getElementById("pinInstruction");

      if (!pinSalvato) {
        if (setupFase === 1) {
          pinTemporaneo = pinInserito;
          pinInserito = "";
          setupFase = 2;
          aggiornaPinDisplay();
          instrEl.textContent = "Ripeti il PIN per conferma";
          errEl.style.display = "none";
        } else if (setupFase === 2) {
          if (pinInserito === pinTemporaneo) {
            localStorage.setItem("giacomo_pin_saved", pinInserito);
            sessionStorage.setItem("giacomo_auth", "true");
            proponiBiometriaGiacomo();
          } else {
            errEl.textContent = "I due PIN non coincidono. Riprova.";
            errEl.style.display = "block";
            setupFase = 1;
            pinTemporaneo = "";
            pinInserito = "";
            instrEl.textContent = "Scegli un PIN di 4 cifre per accedere";
            aggiornaPinDisplay();
          }
        }
      } else {
        if (pinInserito === pinSalvato) {
          sessionStorage.setItem("giacomo_auth", "true");
          sbloccaDashboard();
        } else {
          errEl.textContent = "PIN errato. Riprova.";
          errEl.style.display = "block";
          pinInserito = "";
          aggiornaPinDisplay();
        }
      }
    }

    async function proponiBiometriaGiacomo() {
      if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        const disp = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (disp && confirm("Vuoi attivare lo sblocco rapido con l'impronta digitale?")) {
          try {
            await registraBiometriaGiacomo();
            localStorage.setItem("giacomo_bio_active", "true");
          } catch(e) {
            console.log("Biometria fallita", e);
          }
        }
      }
      sbloccaDashboard();
    }

    async function registraBiometriaGiacomo() {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);
      const createOptions = {
        publicKey: {
          challenge: challenge,
          rp: { name: "Terminale Presenze Mirisa" },
          user: { id: new Uint8Array(16), name: "giacomo@mirisa.it", displayName: "Giacomo - Mirisa" },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }],
          authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
          timeout: 60000
        }
      };
      await navigator.credentials.create(createOptions);
    }

    async function avviaBiometriaGiacomo() {
      if (!window.PublicKeyCredential) return;
      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: { challenge: challenge, timeout: 60000, userVerification: "required" }
        });
        if (assertion) {
          sessionStorage.setItem("giacomo_auth", "true");
          sbloccaDashboard();
        }
      } catch (err) {
        console.log("Impronta non riconosciuta:", err);
      }
    }

    function sbloccaDashboard() {
      document.getElementById("lock-screen").style.display = "none";
      document.getElementById("main-container").style.display = "block";
      if (window.initFirebaseApp) window.initFirebaseApp();
    }

    function bloccaDashboard() {
      sessionStorage.removeItem("giacomo_auth");
      location.reload();
    }

    function cambiaPinGiacomo() {
      if (confirm("Vuoi reimpostare il PIN e l'impronta digitale?")) {
        localStorage.removeItem("giacomo_pin_saved");
        localStorage.removeItem("giacomo_bio_active");
        sessionStorage.removeItem("giacomo_auth");
        location.reload();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initLockScreen();
      if (sessionStorage.getItem("giacomo_auth") === "true") {
        sbloccaDashboard();
      }
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    window.initFirebaseApp = function() {
      if (window.firebaseInitialized) return;
      window.firebaseInitialized = true;

      const firebaseConfig = {
        databaseURL: "https://presenze-dipendenti-e377b-default-rtdb.europe-west1.firebasedatabase.app"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      let dipendentiData = {};
      let presenzeData = {};
      let statoSingolo = "Intera";
      let statoCollettivo = "Intera";

      const oggiStr = new Date().toISOString().split("T")[0];
      document.getElementById("data-singola").value = oggiStr;
      document.getElementById("data-collettiva").value = oggiStr;

      // REGOLA RESPONSIVE: Mese Intero su PC, Settimana su Mobile
      const isPcScreen = window.innerWidth >= 1024;
      let planningMode = isPcScreen ? "month" : "week";
      let currentDateCursor = new Date();
      let activeQuickEdit = { dipendente: null, data: null };

      document.querySelectorAll(".btn-giacomo-toggle").forEach(b => b.classList.remove("active"));
      const initialToggleBtn = document.getElementById(isPcScreen ? "btn-g-plan-month" : "btn-g-plan-week");
      if (initialToggleBtn) initialToggleBtn.classList.add("active");

      function showToast(msg, ok = true) {
        const t = document.getElementById("toast");
        t.style.borderLeftColor = ok ? "var(--success)" : "var(--danger)";
        t.textContent = msg;
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 3000);
      }

      onValue(ref(db, "dipendenti"), (snap) => {
        dipendentiData = snap.val() || {};
        popolaDipendentiSingolo();
        popolaChecklistCollettiva();
        renderPlanning();
      });

      onValue(ref(db, "presenze"), (snap) => {
        presenzeData = snap.val() || {};
        renderPlanning();
      });

      function popolaDipendentiSingolo() {
        const sel = document.getElementById("dipendente-singolo");
        sel.innerHTML = "";
        Object.keys(dipendentiData).forEach(id => {
          const d = dipendentiData[id];
          const opt = document.createElement("option");
          opt.value = d.nome;
          opt.textContent = `${d.nome} (${d.mansione || 'Collaboratore'})`;
          sel.appendChild(opt);
        });
      }

      function popolaChecklistCollettiva() {
        const box = document.getElementById("team-checkbox-list");
        box.innerHTML = "";
        Object.keys(dipendentiData).forEach(id => {
          const d = dipendentiData[id];
          const div = document.createElement("label");
          div.className = "check-item";
          div.innerHTML = `
            <input type="checkbox" class="chk-team" value="${d.nome}" checked>
            <span><strong>${d.nome}</strong> <small style="color:var(--text-muted)">(${d.mansione || 'Dipendente'})</small></span>
          `;
          box.appendChild(div);
        });
      }

      window.switchTab = function(tabId, btn) {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(tabId).classList.add("active");
        if (tabId === "tab-planning") renderPlanning();
      };

      window.setStatoSingolo = function(st, btn) {
        statoSingolo = st;
        document.querySelectorAll("#grid-singolo .btn-status").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };

      window.setStatoCollettivo = function(st, btn) {
        statoCollettivo = st;
        document.querySelectorAll("#grid-collettivo .btn-status").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };

      window.salvaSingolo = function() {
        const dip = document.getElementById("dipendente-singolo").value;
        const data = document.getElementById("data-singola").value;
        if (!dip || !data) return alert("Seleziona collaboratore e data");

        const safeKey = dip.replace(/[^a-zA-Z0-9]/g, "_");
        set(ref(db, `presenze/${data}/${safeKey}`), {
          dipendente: dip,
          data: data,
          stato: statoSingolo,
          orarioRegistrazione: new Date().toISOString(),
          inseritoDa: "Giacomo"
        }).then(() => showToast(`Salvato: ${dip} (${statoSingolo})`));
      };

      window.salvaCollettivo = function() {
        const data = document.getElementById("data-collettiva").value;
        if (!data) return alert("Scegli una data");

        const checked = Array.from(document.querySelectorAll(".chk-team:checked")).map(cb => cb.value);
        if (checked.length === 0) return alert("Seleziona almeno un lavoratore!");

        const promises = checked.map(nome => {
          const safeKey = nome.replace(/[^a-zA-Z0-9]/g, "_");
          return set(ref(db, `presenze/${data}/${safeKey}`), {
            dipendente: nome,
            data: data,
            stato: statoCollettivo,
            orarioRegistrazione: new Date().toISOString(),
            inseritoDa: "Giacomo (Collettivo)"
          });
        });

        Promise.all(promises).then(() => {
          showToast(`Registrati ${checked.length} collaboratori come "${statoCollettivo}"!`);
        });
      };

      window.selezionaTuttiCheckbox = function(check) {
        document.querySelectorAll(".chk-team").forEach(cb => cb.checked = check);
      };

      window.setPlanningMode = function(mode) {
        planningMode = mode;
        document.querySelectorAll(".btn-giacomo-toggle").forEach(b => b.classList.remove("active"));
        document.getElementById(`btn-g-plan-${mode}`).classList.add("active");
        renderPlanning();
      };

      window.navPlanning = function(direction) {
        if (planningMode === "week") {
          currentDateCursor.setDate(currentDateCursor.getDate() + (direction * 7));
        } else {
          currentDateCursor.setMonth(currentDateCursor.getMonth() + direction);
        }
        renderPlanning();
      };

      function renderPlanning() {
        const thead = document.getElementById("planning-head");
        const tbody = document.getElementById("planning-body");
        const titleSpan = document.getElementById("planning-title-range");
        thead.innerHTML = "";
        tbody.innerHTML = "";

        const days = [];
        const giorniNomi = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];

        if (planningMode === "week") {
          const curr = new Date(currentDateCursor);
          const dayOfWeek = curr.getDay();
          const diffToMonday = curr.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
          const monday = new Date(curr.setDate(diffToMonday));

          for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            days.push(d);
          }
          titleSpan.textContent = `Sett. ${days[0].toLocaleDateString('it-IT', {day:'2-digit', month:'short'})} - ${days[6].toLocaleDateString('it-IT', {day:'2-digit', month:'short'})}`;
        } else {
          const year = currentDateCursor.getFullYear();
          const month = currentDateCursor.getMonth();
          const totalDays = new Date(year, month + 1, 0).getDate();
          for (let i = 1; i <= totalDays; i++) {
            days.push(new Date(year, month, i));
          }
          titleSpan.textContent = currentDateCursor.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
        }

        let headHtml = `<tr><th class="name-col">Collaboratore</th>`;
        days.forEach(d => {
          const isToday = d.toISOString().split("T")[0] === oggiStr;
          headHtml += `<th style="${isToday ? 'border-bottom:2px solid var(--accent); color:var(--accent);' : ''}"><span style="font-size:9px;">${giorniNomi[d.getDay()]}</span><br><strong style="font-size:12px;">${d.getDate()}</strong></th>`;
        });
        headHtml += `</tr>`;
        thead.innerHTML = headHtml;

        Object.keys(dipendentiData).forEach(id => {
          const nome = dipendentiData[id].nome;
          let rowHtml = `<tr><td class="name-col">${nome}</td>`;

          days.forEach(d => {
            const iso = d.toISOString().split("T")[0];
            const regGiorno = presenzeData[iso] || {};
            
            let stato = null;
            Object.keys(regGiorno).forEach(k => {
              if (regGiorno[k].dipendente && regGiorno[k].dipendente.toLowerCase() === nome.toLowerCase()) {
                stato = regGiorno[k].stato;
              }
            });

            if (!stato) {
              rowHtml += `<td class="plan-cell-interactive" onclick="apriQuickEditGiacomo('${nome}', '${iso}')"><span class="cell-empty">&bull;</span></td>`;
            } else {
              let sigla = "I";
              let cClass = "cell-I";
              if (stato === "Mattina") { sigla = "M"; cClass = "cell-M"; }
              else if (stato === "Pomeriggio") { sigla = "P"; cClass = "cell-P"; }
              else if (stato === "Assente") { sigla = "A"; cClass = "cell-A"; }
              else if (stato === "Ferie") { sigla = "F"; cClass = "cell-F"; }
              else if (stato === "Malattia") { sigla = "MAL"; cClass = "cell-MAL"; }
              rowHtml += `<td class="plan-cell-interactive" onclick="apriQuickEditGiacomo('${nome}', '${iso}')"><span class="cell-badge ${cClass}" title="${stato}">${sigla}</span></td>`;
            }
          });

          rowHtml += `</tr>`;
          tbody.innerHTML += rowHtml;
        });
      }

      window.apriQuickEditGiacomo = function(nome, dataIso) {
        activeQuickEdit = { dipendente: nome, data: dataIso };
        document.getElementById("quick-nome").textContent = nome;
        document.getElementById("quick-data").textContent = new Date(dataIso).toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: 'short' });
        document.getElementById("modalQuickEdit").style.display = "flex";
      };

      window.chiudiQuickEdit = function() {
        document.getElementById("modalQuickEdit").style.display = "none";
      };

      window.applicaQuickStatoGiacomo = function(stato) {
        if (!activeQuickEdit.dipendente || !activeQuickEdit.data) return;
        const safeKey = activeQuickEdit.dipendente.replace(/[^a-zA-Z0-9]/g, "_");

        if (stato === "DELETE") {
          remove(ref(db, `presenze/${activeQuickEdit.data}/${safeKey}`)).then(() => {
            chiudiQuickEdit();
            showToast(`Cancellato per ${activeQuickEdit.dipendente}`);
          });
        } else {
          set(ref(db, `presenze/${activeQuickEdit.data}/${safeKey}`), {
            dipendente: activeQuickEdit.dipendente,
            data: activeQuickEdit.data,
            stato: stato,
            orarioRegistrazione: new Date().toISOString(),
            inseritoDa: "Giacomo (Planning)"
          }).then(() => {
            chiudiQuickEdit();
            showToast(`Assegnato: ${stato}`);
          });
        }
      };
    };
  </script>
</head>
<body>

  <!-- BLOCCO BIOMETRICO GIACOMO -->
  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-icon"><i class="fa-solid fa-fingerprint"></i></div>
      <h2 id="lockTitle" style="margin: 0; font-size: 20px; font-weight: 800; color: #fff;">Accesso Cantiere</h2>
      <p id="pinInstruction" class="pin-instruction"></p>
      
      <input type="password" id="pinInput" class="pin-display" readonly placeholder="----">
      
      <div class="pin-keypad">
        <button class="pin-btn" onclick="digitaPin('1')">1</button>
        <button class="pin-btn" onclick="digitaPin('2')">2</button>
        <button class="pin-btn" onclick="digitaPin('3')">3</button>
        <button class="pin-btn" onclick="digitaPin('4')">4</button>
        <button class="pin-btn" onclick="digitaPin('5')">5</button>
        <button class="pin-btn" onclick="digitaPin('6')">6</button>
        <button class="pin-btn" onclick="digitaPin('7')">7</button>
        <button class="pin-btn" onclick="digitaPin('8')">8</button>
        <button class="pin-btn" onclick="digitaPin('9')">9</button>
        <button class="pin-btn" style="color: var(--danger); font-size: 16px;" onclick="cancellaPin()"><i class="fa-solid fa-delete-left"></i></button>
        <button class="pin-btn" onclick="digitaPin('0')">0</button>
        <button class="pin-btn pin-btn-bio" onclick="avviaBiometriaGiacomo()" title="Sblocca con Impronta"><i class="fa-solid fa-fingerprint"></i></button>
      </div>

      <div id="pinError" class="pin-error"></div>
    </div>
  </div>

  <!-- PANNELLO PRINCIPALE GIACOMO -->
  <div class="container" id="main-container">
    <div class="brand">
      <div class="btn-top-lock">
        <button class="btn-lock-action" onclick="cambiaPinGiacomo()" title="Reimposta PIN / Impronta"><i class="fa-solid fa-key"></i></button>
        <button class="btn-lock-action" onclick="bloccaDashboard()" title="Blocca"><i class="fa-solid fa-lock"></i></button>
      </div>
      <h1><i class="fa-solid fa-layer-group" style="color:var(--accent);"></i> MIRISA <span>CERAMICHE</span></h1>
      <p>Terminale Presenze & Planning Lavori &bull; Giacomo</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-tutti', this)">
        <i class="fa-solid fa-users"></i> Presenza Squadra
      </button>
      <button class="tab-btn" onclick="switchTab('tab-singolo', this)">
        <i class="fa-solid fa-user"></i> Singolo
      </button>
      <button class="tab-btn" onclick="switchTab('tab-planning', this)">
        <i class="fa-solid fa-calendar-days"></i> Planning
      </button>
    </div>

    <!-- 1. PRESENZA SQUADRA -->
    <div id="tab-tutti" class="tab-content active">
      <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-check-double"></i> Registra Presenza per Tutta la Squadra</h2>
        
        <div class="form-group">
          <label>Data di Riferimento</label>
          <input type="date" id="data-collettiva">
        </div>

        <div class="form-group">
          <label>Stato da applicare a tutti</label>
          <div class="status-grid" id="grid-collettivo">
            <button class="btn-status active" data-status="Intera" onclick="setStatoCollettivo('Intera', this)">
              <i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Intera
            </button>
            <button class="btn-status" data-status="Mattina" onclick="setStatoCollettivo('Mattina', this)">
              <i class="fa-solid fa-sun" style="color:var(--warning);"></i> Mattina
            </button>
            <button class="btn-status" data-status="Pomeriggio" onclick="setStatoCollettivo('Pomeriggio', this)">
              <i class="fa-solid fa-moon" style="color:var(--warning);"></i> Pomeriggio
            </button>
            <button class="btn-status" data-status="Ferie" onclick="setStatoCollettivo('Ferie', this)">
              <i class="fa-solid fa-umbrella-beach" style="color:var(--purple);"></i> Ferie / Chiusura
            </button>
            <button class="btn-status" data-status="Assente" onclick="setStatoCollettivo('Assente', this)">
              <i class="fa-solid fa-ban" style="color:var(--danger);"></i> Assenti
            </button>
            <button class="btn-status" data-status="Malattia" onclick="setStatoCollettivo('Malattia', this)">
              <i class="fa-solid fa-notes-medical" style="color:#64748b;"></i> Malattia
            </button>
          </div>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label style="margin:0;">Lavoratori Coinvolti</label>
            <div>
              <button type="button" onclick="selezionaTuttiCheckbox(true)" style="background:transparent; border:none; color:var(--accent); font-size:12px; cursor:pointer;">Tutti</button>
              <span style="color:var(--text-muted);">&bull;</span>
              <button type="button" onclick="selezionaTuttiCheckbox(false)" style="background:transparent; border:none; color:var(--text-muted); font-size:12px; cursor:pointer;">Nessuno</button>
            </div>
          </div>
          <div class="team-checklist" id="team-checkbox-list"></div>
        </div>

        <button class="btn-submit" onclick="salvaCollettivo()">
          <i class="fa-solid fa-floppy-disk"></i> Applica a Tutta la Squadra
        </button>
      </div>
    </div>

    <!-- 2. SINGOLO -->
    <div id="tab-singolo" class="tab-content">
      <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-user-clock"></i> Timbratura Singola</h2>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="data-singola">
        </div>
        <div class="form-group">
          <label>Collaboratore</label>
          <select id="dipendente-singolo"></select>
        </div>
        <div class="form-group">
          <label>Stato Presenza</label>
          <div class="status-grid" id="grid-singolo">
            <button class="btn-status active" data-status="Intera" onclick="setStatoSingolo('Intera', this)">
              <i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Intera
            </button>
            <button class="btn-status" data-status="Mattina" onclick="setStatoSingolo('Mattina', this)">
              <i class="fa-solid fa-sun" style="color:var(--warning);"></i> Mattina
            </button>
            <button class="btn-status" data-status="Pomeriggio" onclick="setStatoSingolo('Pomeriggio', this)">
              <i class="fa-solid fa-moon" style="color:var(--warning);"></i> Pomeriggio
            </button>
            <button class="btn-status" data-status="Assente" onclick="setStatoSingolo('Assente', this)">
              <i class="fa-solid fa-ban" style="color:var(--danger);"></i> Assente
            </button>
            <button class="btn-status" data-status="Ferie" onclick="setStatoSingolo('Ferie', this)">
              <i class="fa-solid fa-umbrella-beach" style="color:var(--purple);"></i> Ferie
            </button>
            <button class="btn-status" data-status="Malattia" onclick="setStatoSingolo('Malattia', this)">
              <i class="fa-solid fa-notes-medical" style="color:#64748b;"></i> Malattia
            </button>
          </div>
        </div>
        <button class="btn-submit" onclick="salvaSingolo()">
          <i class="fa-solid fa-floppy-disk"></i> Conferma Presenza
        </button>
      </div>
    </div>

    <!-- 3. PLANNING INTERATTIVO -->
    <div id="tab-planning" class="tab-content">
      <div class="card" style="padding: 16px;">
        <div class="planning-controls">
          <div>
            <button onclick="navPlanning(-1)" style="background:#081120; border:1px solid var(--surface-border); color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer;"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="planning-title-range" style="font-weight:700; margin:0 8px; font-size:14px; color:#fff;"></span>
            <button onclick="navPlanning(1)" style="background:#081120; border:1px solid var(--surface-border); color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer;"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="tab-btn btn-giacomo-toggle" id="btn-g-plan-week" style="padding:6px 12px; font-size:12px;" onclick="setPlanningMode('week')">Settimana</button>
            <button class="tab-btn btn-giacomo-toggle" id="btn-g-plan-month" style="padding:6px 12px; font-size:12px;" onclick="setPlanningMode('month')">Mese</button>
          </div>
        </div>

        <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
          <div style="display:flex; gap:8px;">
            <span><b style="color:var(--success)">I</b> = Intera</span>
            <span><b style="color:var(--warning)">M/P</b> = Mezza</span>
            <span><b style="color:var(--danger)">A</b> = Ass.</span>
            <span><b style="color:var(--purple)">F</b> = Ferie</span>
          </div>
          <span style="color:var(--accent); font-weight:bold;"><i class="fa-solid fa-hand-pointer"></i> Tocca una casella per modificare</span>
        </div>

        <div class="table-scroll">
          <table class="plan-table">
            <thead id="planning-head"></thead>
            <tbody id="planning-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- POPUP MODIFICA PER GIACOMO -->
  <div class="modal-backdrop" id="modalQuickEdit">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3 id="quick-nome" style="color:var(--accent); margin:0;"></h3>
          <span id="quick-data" style="font-size:12px; color:var(--text-muted);"></span>
        </div>
        <button onclick="chiudiQuickEdit()" style="background:transparent; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="quick-status-grid">
        <button class="btn-quick-status" onclick="applicaQuickStatoGiacomo('Intera')">
          <i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Intera
        </button>
        <button class="btn-quick-status" onclick="applicaQuickStatoGiacomo('Mattina')">
          <i class="fa-solid fa-sun" style="color:var(--warning);"></i> Mattina
        </button>
        <button class="btn-quick-status" onclick="applicaQuickStatoGiacomo('Pomeriggio')">
          <i class="fa-solid fa-moon" style="color:var(--warning);"></i> Pomeriggio
        </button>
        <button class="btn-quick-status" onclick="applicaQuickStatoGiacomo('Assente')">
          <i class="fa-solid fa-ban" style="color:var(--danger);"></i> Assente
        </button>
        <button class="btn-quick-status" onclick="applicaQuickStatoGiacomo('Ferie')">
          <i class="fa-solid fa-umbrella-beach" style="color:var(--purple);"></i> Ferie
        </button>
        <button class="btn-quick-status" onclick="applicaQuickStatoGiacomo('Malattia')">
          <i class="fa-solid fa-notes-medical" style="color:#64748b;"></i> Malattia
        </button>
      </div>
      <div style="margin-top:14px; text-align:right;">
        <button onclick="applicaQuickStatoGiacomo('DELETE')" style="background:transparent; border:none; color:var(--danger); font-size:12px; cursor:pointer; font-weight:bold;">
          <i class="fa-solid fa-trash"></i> Cancella Presenza
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</body>
</html>
