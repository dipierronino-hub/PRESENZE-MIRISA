  <style>
    :root {
      --bg: #070d19;
      --surface: #0f1b33;
      --surface-border: #1a2c4e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --whatsapp: #25d366;
      --whatsapp-hover: #1ebd5b;
      --mail-color: #6366f1;
      --mail-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --radius: 12px;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; }

    #auth-overlay {
      position: fixed; inset: 0; background: rgba(7, 13, 25, 0.98);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .auth-modal {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: var(--radius); padding: 32px; width: 100%; max-width: 400px;
      text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .auth-modal h2 { margin: 0 0 8px; font-size: 20px; color: #fff; }
    .auth-modal p { margin: 0 0 20px; font-size: 13px; color: var(--text-muted); }
    .auth-input {
      width: 100%; background: #081120; border: 1px solid var(--surface-border);
      color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none;
    }
    .auth-input:focus { border-color: var(--accent); }
    .auth-btn {
      width: 100%; background: var(--accent); color: #04101e; border: none;
      padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .auth-btn:hover { background: var(--accent-hover); }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: var(--radius); padding: 16px 24px; margin-bottom: 24px;
    }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav-btn {
      background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-muted);
      padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .nav-btn.active { background: var(--accent); color: #04101e; border-color: var(--accent); }

    .card {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    }

    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .toolbar select, .toolbar input {
      background: #081120; border: 1px solid var(--surface-border); color: #fff;
      padding: 8px 12px; border-radius: 6px; font-size: 14px; outline: none;
    }

    .table-container { overflow-x: auto; max-width: 100%; border-radius: 8px; border: 1px solid var(--surface-border); min-height: 120px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
    th, td { padding: 8px 6px; border: 1px solid var(--surface-border); }
    th { background: #0b1528; color: var(--text-muted); font-weight: 700; }
    th.dip-header { text-align: left; padding-left: 12px; min-width: 170px; position: sticky; left: 0; background: #0b1528; z-index: 10; }
    td.dip-cell { text-align: left; padding-left: 12px; font-weight: 700; position: sticky; left: 0; background: var(--surface); z-index: 5; }

    .day-cell { cursor: pointer; transition: background 0.2s; font-weight: 700; font-size: 11px; height: 38px; }
    .day-cell:hover { background: rgba(56, 189, 248, 0.15); }
    .st-intera { background: rgba(16, 185, 129, 0.25); color: var(--success); }
    .st-assente { background: rgba(239, 68, 68, 0.25); color: var(--danger); }
    .st-mattina { background: rgba(245, 158, 11, 0.25); color: var(--warning); }
    .st-pomeriggio { background: rgba(245, 158, 11, 0.25); color: var(--warning); }
    .st-ferie { background: rgba(139, 92, 246, 0.25); color: var(--purple); }

    .dropzone {
      border: 2px dashed var(--accent); background: rgba(56, 189, 248, 0.04);
      border-radius: var(--radius); padding: 30px; text-align: center; transition: all 0.2s;
    }
    .dropzone.dragover { background: rgba(56, 189, 248, 0.15); border-color: #fff; }
    .btn-action {
      background: var(--accent); color: #04101e; border: none; padding: 10px 20px;
      border-radius: 8px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-action:hover { background: var(--accent-hover); }

    .btn-whatsapp {
      background: var(--whatsapp); color: #04101e; border: none; padding: 6px 10px;
      border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
    }
    .btn-whatsapp:hover { background: var(--whatsapp-hover); }

    .btn-mail {
      background: var(--mail-color); color: #fff; border: none; padding: 6px 10px;
      border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-mail:hover { background: var(--mail-hover); }

    .cedolini-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-top: 20px;
    }
    .cedolino-card {
      background: #081120; border: 1px solid var(--surface-border); border-radius: 8px; padding: 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }

    #loading-state { padding: 40px; text-align: center; color: var(--accent); font-weight: 700; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--success); display: none; z-index: 10000; font-size: 13px; font-weight: 600; }
  </style>
</head>

---

### 1. Il blocco del modulo ES6 (La causa principale)
Nelle ultime modifiche abbiamo usato la sintassi `onclick="window.effettuaLogin()"`.  
Nei browser moderni, quando uno script è dichiarato come `type="module"`, l'oggetto globale `window` spesso non registra la funzione in tempo se si verifica un piccolo errore o un ritardo nel caricamento delle librerie esterne. Di conseguenza, cliccando su **Accedi** il browser non trova la funzione ed è come se premessi a vuoto.

### 2. Cache del browser non aggiornata
Se hai modificato il file su GitHub, GitHub Pages impiega fino a 60-90 secondi per aggiornare la versione online. Se premi subito F5, il browser continua a usare la vecchia versione in memoria.

### 3. Password errata o credenziali non sincronizzate
Se la password inserita non corrisponde a quella impostata in Firebase Authentication per `dipierro.nino@gmail.com`, Firebase rifiuta la richiesta.

---

### Come risolvere subito e sbloccare l'accesso:

Colleghiamo i pulsanti di login con **`addEventListener` diretto** invece di `onclick` HTML, e stampiamo qualsiasi anomalia visibile sia a schermo che nella console.

Ecco la modifica mirata da applicare nel tuo codice dentro il tag `<script type="module">` di `admin.html`:

1. **Rimuovi** l'attributo `onclick="window.effettuaLogin()"` dal pulsante HTML:
   ```html
   <button type="button" id="btn-login" class="auth-btn">
     <i class="fa-solid fa-arrow-right-to-bracket"></i> Accedi
   </button>
