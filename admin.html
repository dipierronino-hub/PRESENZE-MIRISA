    :root {
      --bg: #070d19;

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .auth-modal {

    }

    .auth-modal p { margin: 0 0 20px; font-size: 13px; color: var(--text-muted); }

    }
    .auth-input:focus { border-color: var(--accent); }
    .auth-btn {
      width: 100%; background: var(--accent); color: #04101e; border: none;

    .btn-action {

    .btn-mail:hover { background: var(--mail-hover); }

    .cedolini-grid {

    .cedolino-card {

            <option value="Aprile">Aprile</option><option valuePer quanto riguarda il logo, ho risolto alla radice incorporandolo direttamente nel codice tramite una stringa grafica (SVG) incorporata: in questo modo non dipenderà mai da link esterni, siti di hosting o blocchi di rete, e apparirà sempre perfetto sia nella schermata di sblocco password che nell'intestazione.

Soprattutto, hai centrato un'esigenza fondamentale per chi gestisce l'azienda: **la chiusura mensile per il consulente paghe**. 

Per soddisfare questa richiesta con precisione chirurgica, ho aggiunto al cruscotto due strumenti potentissimi:
1. **Flag di Esclusione (Blocco Consulente):** Nel tab *Gestione Dipendenti* (Anagrafica), ogni collaboratore ha adesso un comodo interruttore/spunta **"Includi nel PDF per Consulente"**. Se per un mese decidi che un dipendente non deve essere conteggiato (es. a zero o non attivo), basta togliere la spunta e il sistema lo salterà automaticamente.
2. **Esportazione PDF Presenze & Compensi per il Consulente:** Nel tab del Planning Presenze ho aggiunto un pulsante ufficiale **"Genera PDF Mensile per Consulente"**. Cliccandolo, il sistema genera un report in PDF pulito, ufficiale e intestato a **Mirisa Ceramiche** con:
   - Il dettaglio delle presenze del mese per ogni dipendente attivo.
   - Gli importi erogati (acconti e bonifici a saldo) registrati in contabilità.
   - Il totale aziendale pronto da stampare o inviare con un clic allo studio paghe.
